spring:
  application:
    name: moto-tracker
  datasource:
    url: ${TRACKER_DB_URL:jdbc:postgresql://localhost:5432/tracker}
    username: ${TRACKER_DB_USER:tracker}
    password: ${TRACKER_DB_PASSWORD:tracker}
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        same-site: lax
        secure: ${TRACKER_SECURE_COOKIES:true}
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

tracker:
  timezone: America/Bogota
  username: ${TRACKER_USERNAME:}
  password: ${TRACKER_PASSWORD:}
  remember-me-key: ${TRACKER_REMEMBER_ME_KEY:}
  traccar:
    webhook-token: ${TRACKER_WEBHOOK_TOKEN:}
  telegram:
    bot-token: ${TRACKER_TELEGRAM_BOT_TOKEN:}
    chat-id: ${TRACKER_TELEGRAM_CHAT_ID:}

logging:
  level:
    com.mototracker: INFO
