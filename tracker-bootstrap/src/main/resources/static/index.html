<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <title>Mi moto</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="bar">
    <select id="tracker" aria-label="Vehículo"></select>
    <div id="status" class="status">Cargando…</div>
  </header>

  <main id="map" aria-label="Mapa"></main>

  <nav class="actions">
    <button id="btn-center" title="Centrar en la moto">📍 Moto</button>
    <button id="btn-route" title="Recorrido de hoy">🛣 Hoy</button>
    <button id="btn-zones" title="Geocercas">⭕ Zonas</button>
    <button id="btn-alerts" title="Alertas">🔔 Alertas</button>
  </nav>

  <section id="panel" class="panel" hidden>
    <header><h2 id="panel-title"></h2><button id="panel-close" aria-label="Cerrar">✕</button></header>
    <div id="panel-body"></div>
  </section>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
